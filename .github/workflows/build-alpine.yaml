name: Build Alpine ISO

on:
  push:
    branches: [ "main", "tty-respawn", "tui-drive-fix" ]
    tags: [ v* ]
  workflow_dispatch:

jobs:
  rust-ci:
    uses: ./.github/workflows/rust-ci.yml

  build-iso:
    needs: [rust-ci]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin-x86_64-alpine
          path: target/x86_64-unknown-linux-musl/release/

      - name: mark binary executable
        run: chmod +x target/x86_64-unknown-linux-musl/release/fix-automation

      - name: build Alpine ISO in Docker
        run: |
          docker build -t fix-automation-builder -f dist/alpine/Dockerfile .
          docker run --rm --privileged \
            -v $PWD:/build \
            -e BINARY_PATH=/build/target/x86_64-unknown-linux-musl/release/fix-automation \
            -e OUTPUT_DIR=/build/dist/alpine/output \
            fix-automation-builder \
            sh /build/dist/alpine/build.sh --arch x86_64

      - name: verify ISO contents
        run: |
          xorriso -indev dist/alpine/output/fix-automation-x86_64-alpine.iso -print 2>&1 | head -40
          echo "---"
          isoinfo -l -i dist/alpine/output/fix-automation-x86_64-alpine.iso 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso
          path: dist/alpine/output/fix-automation-x86_64-alpine.iso
          retention-days: 7

  qemu-boot:
    needs: [build-iso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso

      - name: install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: boot test UEFI
        run: |
          OVMF=$(find /usr/share -name "OVMF.4m.fd" 2>/dev/null | head -1)
          [ -z "$OVMF" ] && OVMF=$(find /usr/share -name "OVMF.fd" 2>/dev/null | head -1)
          [ -z "$OVMF" ] && OVMF="/usr/share/ovmf/OVMF.fd"
          echo "Using OVMF: $OVMF"
          timeout 30 qemu-system-x86_64 \
            -cdrom fix-automation-x86_64-alpine.iso \
            -m 512M -machine q35 -nographic \
            -bios "$OVMF" \
            -no-reboot -accel tcg 2>&1 | tee serial-uefi.log || true
          grep -q "init process" serial-uefi.log \
            && echo "UEFI PASS" \
            || (echo "UEFI FAIL"; cat serial-uefi.log; exit 1)

      - name: boot test BIOS
        run: |
          timeout 30 qemu-system-x86_64 \
            -cdrom fix-automation-x86_64-alpine.iso \
            -m 512M -machine pc -nographic \
            -no-reboot -accel tcg 2>&1 | tee serial-bios.log || true
          grep -q "init process" serial-bios.log \
            && echo "BIOS PASS" \
            || (echo "BIOS FAIL"; cat serial-bios.log; exit 1)

      - name: check binary is present in ISO
        run: |
          isoinfo -l -i fix-automation-x86_64-alpine.iso 2>/dev/null \
            | grep -qi "fix-automation" \
            && echo "BINARY PRESENT" \
            || echo "WARNING: could not verify binary in ISO listing"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-logs-alpine
          path: |
            serial-uefi.log
            serial-bios.log
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qemu-boot]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso

      - name: generate changelog
        uses: orhun/git-cliff-action@v3
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/release_notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.txt
          files: fix-automation-x86_64-alpine.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
