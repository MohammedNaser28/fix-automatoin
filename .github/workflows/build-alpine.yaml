name: Build Alpine ISO

on:
  push:
    branches: [ "main", "tty-respawn", "tui-drive-fix" ]
    tags: [ v* ]
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with: { components: clippy, rustfmt }
      - run: cargo fmt --check
      - run: cargo clippy --features alpine -- -D warnings

  test:
    needs: [lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test

  build-rust:
    needs: [test]
    strategy:
      matrix:
        arch: [x86_64]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.arch }}-unknown-linux-musl

      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            target
          key: ${{ runner.os }}-cargo-alpine-${{ hashFiles('Cargo.lock', 'src/**/*.rs') }}
          restore-keys: ${{ runner.os }}-cargo-alpine-

      - name: Build static binary
        run: cargo build --release --target ${{ matrix.arch }}-unknown-linux-musl --features alpine

      - uses: actions/upload-artifact@v4
        with:
          name: rust-bin-${{ matrix.arch }}
          path: target/${{ matrix.arch }}-unknown-linux-musl/release/fix-automation
          retention-days: 1

  build-iso:
    needs: [build-rust]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin-x86_64
          path: target/x86_64-unknown-linux-musl/release/

      - name: Build Alpine ISO in Docker
        run: |
          docker build -t fix-automation-builder -f dist/alpine/Dockerfile .
          docker run --rm --privileged \
            -v $PWD:/build \
            -e BINARY_PATH=/build/target/x86_64-unknown-linux-musl/release/fix-automation \
            -e OUTPUT_DIR=/build/dist/alpine/output \
            fix-automation-builder \
            sh /build/dist/alpine/build.sh --arch x86_64

      - uses: actions/upload-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso
          path: dist/alpine/output/fix-automation-x86_64-alpine.iso
          retention-days: 7

  qemu-boot:
    needs: [build-iso]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso

      - name: Install QEMU deps
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: Boot test
        run: |
          timeout 30 qemu-system-x86_64 \
            -cdrom fix-automation-x86_64-alpine.iso \
            -m 512M -machine pc -nographic -no-reboot -accel tcg 2>&1 | tee serial.log || true
          grep -q "GRUB-RESCUE\|fix-automation\|VERSION" serial.log && echo "PASS" || (echo "FAIL: TUI not detected"; cat serial.log; exit 1)

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qemu-boot]
    runs-on: ubuntu-latest
    permissions: { contents: write }
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-alpine.iso

      - uses: softprops/action-gh-release@v2
        with:
          files: fix-automation-x86_64-alpine.iso
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
