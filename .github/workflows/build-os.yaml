name: Build Bootable OS & Rust Release

on:
  push:
    branches: [ "main", "tty-respawn", "tui-drive-fix" ]
    tags: [ "v*" ]
  workflow_dispatch:

env:
  BUILDROOT_VERSION: "2025.02.13"

jobs:
  rust-ci:
    uses: ./.github/workflows/rust-ci.yml
    with:
      features: default

  build-os:
    name: Build Buildroot OS image
    needs: [rust-ci]
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin-x86_64-default
          path: target/x86_64-unknown-linux-musl/release/

      - name: mark binary executable
        run: chmod +x target/x86_64-unknown-linux-musl/release/fix-automation

      - name: install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            make gcc g++ unzip git bc python3 \
            device-tree-compiler mtools parted \
            dosfstools cpio rsync wget \
            musl-tools libssl-dev libelf-dev \
            xorriso grub-pc-bin grub-efi-amd64-bin

      - name: cache Buildroot downloads
        uses: actions/cache@v4
        with:
          path: buildroot/dl
          key: ${{ runner.os }}-buildroot-dl-${{ hashFiles('os-config/configs/linux_rescue_defconfig') }}
          restore-keys: ${{ runner.os }}-buildroot-dl-

      - name: download Buildroot
        run: |
          wget -q https://buildroot.org/downloads/buildroot-${BUILDROOT_VERSION}.tar.gz
          mkdir -p buildroot
          tar -xf buildroot-${BUILDROOT_VERSION}.tar.gz -C buildroot --strip-components=1

      - name: inject binary into overlay
        run: |
          mkdir -p os-config/rootfs_overlay/usr/bin
          cp target/x86_64-unknown-linux-musl/release/fix-automation \
             os-config/rootfs_overlay/usr/bin/fix-automation
          chmod +x os-config/rootfs_overlay/usr/bin/fix-automation

      - name: build OS image
        run: |
          cd buildroot
          make BR2_EXTERNAL=$(pwd)/../os-config linux_rescue_defconfig
          make -j$(nproc)

      - name: find EFI binary
        id: efi
        run: |
          EFI_BIN=$(find buildroot/output/images/ -name "*.efi" | head -n 1)
          if [ -z "$EFI_BIN" ]; then
            echo "ERROR: GRUB EFI binary not found"
            find buildroot/output/images/ -type f | sort
            exit 1
          fi
          echo "path=${EFI_BIN}" >> $GITHUB_OUTPUT

      - name: package bootable ZIP
        run: |
          mkdir -p release/EFI/BOOT
          cp buildroot/output/images/bzImage        release/EFI/BOOT/
          cp buildroot/output/images/rootfs.cpio.gz release/EFI/BOOT/
          cp ${{ steps.efi.outputs.path }}           release/EFI/BOOT/BOOTX64.EFI

          # Copy GRUB theme
          mkdir -p release/boot/grub/themes/fix-automation
          cp dist/grub-theme/*.png dist/grub-theme/*.pf2 \
             release/boot/grub/themes/fix-automation/
          cp dist/grub-theme/theme-buildroot.txt \
             release/boot/grub/themes/fix-automation/theme.txt

          cat > release/EFI/BOOT/grub.cfg << 'EOF'
          set timeout=5
          set default=0

          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output console serial

          # Graphics theme (safe fallback to text mode if unavailable)
          insmod all_video
          insmod gfxterm
          insmod png
          if [ -e /boot/grub/themes/fix-automation/theme.txt ]; then
              insmod gfxmenu
              terminal_output gfxterm
              set theme=/boot/grub/themes/fix-automation/theme.txt
          fi

          menuentry "Fix-Automation Rescue (Buildroot)" {
              if [ "${grub_platform}" != "efi" ]; then
                  set gfxpayload=text
              fi
              linux  /EFI/BOOT/bzImage console=ttyS0,115200 console=tty0 loglevel=7 earlycon=efifb fbcon=nodefer
              initrd /EFI/BOOT/rootfs.cpio.gz
          }

          menuentry "Reboot" {
              reboot
          }

          menuentry "Poweroff" {
              halt
          }
          EOF
          cd release && zip -r ../grub-rescue-usb.zip .

      - name: build bootable ISO (Ventoy compatible)
        run: |
          mkdir -p iso-root/EFI/BOOT iso-root/boot/grub

          cp buildroot/output/images/bzImage        iso-root/EFI/BOOT/
          cp buildroot/output/images/rootfs.cpio.gz iso-root/EFI/BOOT/
          cp ${{ steps.efi.outputs.path }}           iso-root/EFI/BOOT/BOOTX64.EFI

          # Copy GRUB theme (available for manual loading or Ventoy users)
          mkdir -p iso-root/boot/grub/themes/fix-automation
          cp dist/grub-theme/*.png dist/grub-theme/*.pf2 \
             iso-root/boot/grub/themes/fix-automation/
          cp dist/grub-theme/theme-buildroot.txt \
             iso-root/boot/grub/themes/fix-automation/theme.txt

          # GRUB config for ISO boot (EFI + BIOS fallback via grub-pc-bin)
          cat > iso-root/boot/grub/grub.cfg << 'EOF'
          set timeout=5
          set default=0

          serial --unit=0 --speed=115200
          terminal_input serial console
          terminal_output console serial

          search --set=root --label FIX_AUTOMATION

          # Graphics theme
          insmod all_video
          insmod gfxterm
          insmod png
          if [ -e /boot/grub/themes/fix-automation/theme.txt ]; then
              insmod gfxmenu
              terminal_output gfxterm
              set theme=/boot/grub/themes/fix-automation/theme.txt
          fi

          menuentry "Fix-Automation Rescue (Buildroot)" {
              if [ "${grub_platform}" != "efi" ]; then
                  set gfxpayload=text
              fi
              linux  /EFI/BOOT/bzImage console=ttyS0,115200 console=tty0 loglevel=7 earlycon=efifb fbcon=nodefer
              initrd /EFI/BOOT/rootfs.cpio.gz
          }

          menuentry "Reboot" {
              reboot
          }

          menuentry "Poweroff" {
              halt
          }
          EOF

          grub-mkrescue \
            --output=fix-automation-x86_64-buildroot.iso \
            iso-root/ \
            -- -volid FIX-AUTOMATION

      - name: verify ISO
        run: |
          xorriso -indev fix-automation-x86_64-buildroot.iso -print 2>&1 | head -40

      - uses: actions/upload-artifact@v4
        with:
          name: grub-rescue-usb
          path: grub-rescue-usb.zip
          retention-days: 7

      - uses: actions/upload-artifact@v4
        with:
          name: fix-automation-x86_64-buildroot.iso
          path: fix-automation-x86_64-buildroot.iso
          retention-days: 7

  qemu-boot-uefi:
    name: Boot test — UEFI (ZIP)
    needs: [build-os]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: grub-rescue-usb

      - name: install QEMU + OVMF
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86 ovmf

      - name: boot test UEFI via direct kernel+initrd
        run: |
          unzip grub-rescue-usb.zip -d usb-contents
          OVMF=$(find /usr/share -name "OVMF.4m.fd" 2>/dev/null | head -1)
          [ -z "$OVMF" ] && OVMF=$(find /usr/share -name "OVMF.fd" 2>/dev/null | head -1)
          [ -z "$OVMF" ] && OVMF="/usr/share/ovmf/OVMF.fd"
          echo "Using OVMF: $OVMF"
          timeout 45 qemu-system-x86_64 \
            -kernel usb-contents/EFI/BOOT/bzImage \
            -initrd usb-contents/EFI/BOOT/rootfs.cpio.gz \
            -append "console=ttyS0 loglevel=7" \
            -m 1G -machine q35 -nographic \
            -bios "$OVMF" \
            -no-reboot -accel tcg 2>&1 | tee serial-uefi.log || true

          grep -q "Run /init as init process" serial-uefi.log \
            && echo "UEFI PASS" \
            || (echo "UEFI FAIL"; cat serial-uefi.log; exit 1)

      - name: check binary is present and executable
        run: |
          # Verify the fix-automation binary made it into the initrd
          zcat usb-contents/EFI/BOOT/rootfs.cpio.gz \
            | cpio -t 2>/dev/null \
            | grep -q "usr/bin/fix-automation" \
            && echo "BINARY PRESENT" \
            || (echo "BINARY MISSING FROM INITRD"; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-uefi-buildroot
          path: serial-uefi.log
          retention-days: 3

  qemu-boot-bios:
    name: Boot test — BIOS (ISO)
    needs: [build-os]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-buildroot.iso

      - name: install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-system-x86

      - name: boot test BIOS via ISO
        run: |
          timeout 45 qemu-system-x86_64 \
            -cdrom fix-automation-x86_64-buildroot.iso \
            -m 512M -machine pc -nographic \
            -no-reboot -accel tcg 2>&1 | tee serial-bios.log || true

          grep -q "Run /init as init process" serial-bios.log \
            && echo "BIOS PASS" \
            || (echo "BIOS FAIL"; cat serial-bios.log; exit 1)

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: serial-log-bios-buildroot
          path: serial-bios.log
          retention-days: 3

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [qemu-boot-uefi, qemu-boot-bios]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          name: grub-rescue-usb

      - uses: actions/download-artifact@v4
        with:
          name: fix-automation-x86_64-buildroot.iso

      - uses: actions/download-artifact@v4
        with:
          name: rust-bin-x86_64-default
          path: bin/

      - name: generate changelog
        uses: orhun/git-cliff-action@v3
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip all
        env:
          OUTPUT: /tmp/release_notes.txt

      - uses: softprops/action-gh-release@v2
        with:
          body_path: /tmp/release_notes.txt
          files: |
            grub-rescue-usb.zip
            fix-automation-x86_64-buildroot.iso
            bin/fix-automation
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
