set timeout=5
set default=0

serial --unit=0 --speed=115200
terminal_input serial

# Graphics theme (safe fallback to text mode if unavailable)
# Theme file is inside the FAT EFI boot image (accessible from GRUB's initial
# root on UEFI), not on the ISO filesystem. BIOS mode falls back to text.
insmod all_video
insmod gfxterm
insmod png
if [ -e /boot/grub/themes/fix-automation/theme.txt ]; then
    insmod gfxmenu
    terminal_output gfxterm
    set theme=/boot/grub/themes/fix-automation/theme.txt
fi

menuentry "Fix-Automation Rescue (Alpine)" {
    search --set=root --label FIX_AUTOMATION
    linux  /boot/vmlinuz init=/fix-automation \
        console=ttyS0,115200n8 console=tty0 \
        earlycon=efifb loglevel=8 fbcon=nodefer
    initrd /boot/initramfs.cpio.gz
}

menuentry "Boot from next volume" {
    exit
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "Reboot" {
    reboot
}

menuentry "Poweroff" {
    halt
}
