set timeout=5
set default=0

serial --unit=0 --speed=115200
terminal_output console serial

# Find the ISO volume by label (GRUB boots from the FAT EFI image, not the ISO)
search --set=root --label FIX_AUTOMATION

menuentry "Fix-Automation Rescue" {
    linux  /boot/vmlinuz init=/fix-automation \
        console=tty0 console=ttyS0,115200n8 \
        earlycon=efifb,keep nomodeset loglevel=8
    initrd /boot/initramfs.cpio.gz
}
