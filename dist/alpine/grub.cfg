set timeout=5
set default=0

# Load theme
set gfxmode=1920x1080,1024x768,auto
insmod all_video
insmod gfxterm
insmod gfxmenu
terminal_output gfxterm

serial --unit=0 --speed=115200
terminal_input serial

# Find the ISO volume by label
search --set=root --label FIX_AUTOMATION

set theme=/boot/grub/themes/yorha/theme.txt

menuentry "Fix-Automation Rescue" {
    linux  /boot/vmlinuz init=/fix-automation \
        console=ttyS0,115200n8 console=tty0 \
        earlycon=efifb loglevel=8 fbcon=nodefer
    initrd /boot/initramfs.cpio.gz
}

menuentry "Boot from next volume" {
    exit
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "Reboot" {
    reboot
}

menuentry "Poweroff" {
    halt
}
