set timeout=5
set default=0

serial --unit=0 --speed=115200
terminal_input serial console
terminal_output console serial

# Graphics theme (bochs-drm handles UEFI; gfxpayload=text on BIOS)
insmod all_video
insmod gfxterm
insmod png
if [ -e /boot/grub/themes/fix-automation/theme.txt ]; then
    insmod gfxmenu
    terminal_output gfxterm
    set theme=/boot/grub/themes/fix-automation/theme.txt
fi

search --set=root --label FIX_AUTOMATION

menuentry "Fix-Automation Rescue" {
    if [ "${grub_platform}" != "efi" ]; then
        set gfxpayload=text
    fi
    linux  /boot/vmlinuz init=/fix-automation \
        console=ttyS0,115200n8 console=tty0 \
        loglevel=8
    initrd /boot/initramfs.cpio.gz
}

menuentry "Boot from next volume" {
    exit
}

menuentry "UEFI Firmware Settings" {
    fwsetup
}

menuentry "Reboot" {
    reboot
}

menuentry "Poweroff" {
    halt
}
